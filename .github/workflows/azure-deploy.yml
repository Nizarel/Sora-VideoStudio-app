name: Deploy Starbucks Video Studio to Azure

on:
  push:
    branches: [ sora2ui ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: starbucks-video-studio
  NODE_VERSION: '20.x'
  RESOURCE_GROUP: sbux-rg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Prepare deployment package
      run: |
        # Create a clean deployment directory with source files only
        mkdir -p deploy
        
        # Copy source files (let Azure build on the server)
        cp -r app deploy/
        cp -r components deploy/
        cp -r hooks deploy/
        cp -r lib deploy/
        cp -r public deploy/
        cp -r services deploy/
        cp -r types deploy/
        cp -r ui deploy/
        cp -r utils deploy/
        
        # Copy config files
        cp package.json deploy/
        cp package-lock.json deploy/
        cp next.config.ts deploy/
        cp tsconfig.json deploy/
        cp postcss.config.mjs deploy/
        cp tailwind.config.ts deploy/ || cp tailwind.config.js deploy/ || true
        cp middleware.ts deploy/ || true
        cp next-env.d.ts deploy/ || true
        
        # Create .deployment file to control build behavior
        echo "[config]" > deploy/.deployment
        echo "SCM_DO_BUILD_DURING_DEPLOYMENT = true" >> deploy/.deployment
        
        # Create startup script
        echo "#!/bin/sh" > deploy/startup.sh
        echo "node .next/standalone/server.js" >> deploy/startup.sh
        chmod +x deploy/startup.sh
    
    - name: Deploy via Azure CLI
      run: |
        cd deploy
        zip -qr ../site.zip .
        cd ..
        az webapp deploy --name "$AZURE_WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --src-path site.zip --type zip --async false
        echo "✅ Deployment package uploaded!"
    
    - name: Enable HTTPS-only
      run: |
        az webapp update --name "$AZURE_WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --set httpsOnly=true
