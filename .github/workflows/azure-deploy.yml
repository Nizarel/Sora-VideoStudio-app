name: Deploy Starbucks Video Studio to Azure

on:
  push:
    branches: [ sora2ui ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: starbucks-video-studio
  NODE_VERSION: '20.x'
  RESOURCE_GROUP: sbux-rg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build Next.js app
      run: npm run build
    
    - name: Prepare deployment package
      run: |
        mkdir -p deploy
        cp -r .next deploy/
        cp -r public deploy/
        cp package.json deploy/
        cp package-lock.json deploy/
        cp next.config.ts deploy/
        cp middleware.ts deploy/ || true
    
    - name: Deploy via Azure CLI
      run: |
        cd deploy
        zip -qr ../site.zip .
        cd ..
        az webapp deploy --name "$AZURE_WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --src-path site.zip --type zip
        echo "✅ Deployment complete!"
    
    - name: Enable HTTPS-only
      run: |
        az webapp update --name "$AZURE_WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --set httpsOnly=true
