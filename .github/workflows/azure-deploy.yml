name: Deploy Starbucks Video Studio to Azure

on:
  push:
    branches: [ sora2ui ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: starbucks-video-studio
  NODE_VERSION: '20.x'
  RESOURCE_GROUP: sbux-rg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build application
      run: npm run build
    
    - name: Prepare deployment package
      run: |
        # Create deployment directory with built standalone app
        mkdir -p deploy
        
        # Copy the standalone build output
        cp -r .next/standalone/. deploy/
        
        # Copy static files
        cp -r .next/static deploy/.next/static
        cp -r public deploy/public
        
        # Create package.json with minimal production dependencies
        cat > deploy/package.json << 'EOF'
        {
          "name": "starbucks-video-studio",
          "version": "1.0.0",
          "scripts": {
            "start": "node server.js"
          },
          "dependencies": {
            "next": "15.5.4"
          }
        }
        EOF
    
    - name: Deploy via Azure CLI
      run: |
        cd deploy
        zip -qr ../site.zip .
        cd ..
        az webapp deploy --name "$AZURE_WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --src-path site.zip --type zip --async true
        echo "✅ Deployment initiated!"
    
    - name: Enable HTTPS-only
      run: |
        az webapp update --name "$AZURE_WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --set httpsOnly=true
